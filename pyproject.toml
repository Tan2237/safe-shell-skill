[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-shell-mcp"
dynamic = ["version"]
description = "Structured shell argument quoting through a CLI and persistent MCP tools"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tan2237", email = "tanyu2237@outlook.com" }
]
keywords = ["mcp", "shell", "quoting", "agents", "command-line"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff==0.16.0",
  "twine>=6,<7"
]

[project.urls]
Homepage = "https://github.com/Tan2237/safe-shell-skill"
Repository = "https://github.com/Tan2237/safe-shell-skill"
Issues = "https://github.com/Tan2237/safe-shell-skill/issues"

[project.scripts]
safe-shell = "safe_shell_mcp.cli:main"
safe-shell-mcp = "safe_shell_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "skills/safe-shell" }
py-modules = ["safe_shell"]

[tool.setuptools.packages.find]
where = ["skills/safe-shell"]
include = ["safe_shell_mcp*"]

[tool.setuptools.dynamic]
version = { attr = "safe_shell_mcp.__version__" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
