name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.9"
          - "3.x"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install real POSIX shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish ksh zsh
      - name: Install MSYS2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check mcp/ skills/ tests/ --no-cache
      - run: python -m compileall -q mcp/ skills/
      - run: safe-shell-mcp --version
      - name: Run tests
        env:
          SAFE_SHELL_TEST_MSYS2_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
        run: python -m pytest tests/ -v

  package:
    name: build and smoke distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke installed wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/safe-shell-smoke"
          source "$RUNNER_TEMP/safe-shell-smoke/bin/activate"
          python -m pip install dist/*.whl
          safe-shell-mcp --version
          safe-shell --request-base64 eyJzaGVsbCI6ImJhc2giLCJ0ZXh0IjoiZm9vJ2JhciJ9
          safe-shell-mcp doctor --timeout 10 --json
          mkdir "$RUNNER_TEMP/safe-shell-project"
          safe-shell-mcp install --client cursor --scope project \
            --project-dir "$RUNNER_TEMP/safe-shell-project" --dry-run --json
